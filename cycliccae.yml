name: cyclicCAE
channels:
  - conda-forge
  - https://conda.graylab.jhu.edu
  - https://conda.rosettacommons.org
dependencies:
  - python>=3.9,<3.13
  - pip
  - numpy=1.26.4
  - pandas
  - matplotlib
  - seaborn
  - plotly
  - requests
  - python-dateutil
  - tqdm
  - biotite
  - pip:
  # leave uncommented for CUDA, comment out for 
      - --find-links https://download.pytorch.org/whl/cu121
      - --find-links https://west.rosettacommons.org/pyrosetta/quarterly/release
      - torch==2.2.0
      - torchvision==0.17.0
      - torchaudio==2.2.0
      - pyrosetta==2026.3
